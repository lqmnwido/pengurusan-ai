services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: open-webui-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB-openwebui}
      - POSTGRES_USER=${POSTGRES_USER-openwebui}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD-openwebui}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER-openwebui} -d ${POSTGRES_DB-openwebui}']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: open-webui-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER-openwebui}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD-openwebui-secret}
    volumes:
      - minio-data:/data
    ports:
      - ${MINIO_API_PORT-9000}:9000
      - ${MINIO_CONSOLE_PORT-9001}:9001
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: open-webui-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER-openwebui}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD-openwebui-secret}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME-open-webui}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing local/\"$${S3_BUCKET_NAME}\";
      "

  ollama:
    volumes:
      - ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-latest}

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'WEBUI_SECRET_KEY='
      - 'DATABASE_URL=postgresql://${POSTGRES_USER-openwebui}:${POSTGRES_PASSWORD-openwebui}@postgres:5432/${POSTGRES_DB-openwebui}'
      - 'VECTOR_DB=pgvector'
      - 'PGVECTOR_DB_URL=postgresql://${POSTGRES_USER-openwebui}:${POSTGRES_PASSWORD-openwebui}@postgres:5432/${POSTGRES_DB-openwebui}'
      - 'STORAGE_PROVIDER=s3'
      - 'STORAGE_LOCAL_CACHE=true'
      - 'S3_ENDPOINT_URL=http://minio:9000'
      - 'S3_ACCESS_KEY_ID=${MINIO_ROOT_USER-openwebui}'
      - 'S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD-openwebui-secret}'
      - 'S3_BUCKET_NAME=${S3_BUCKET_NAME-open-webui}'
      - 'S3_REGION_NAME=${S3_REGION_NAME-us-east-1}'
      - 'S3_ADDRESSING_STYLE=path'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  ollama: {}
  open-webui: {}
  postgres-data: {}
  minio-data: {}
